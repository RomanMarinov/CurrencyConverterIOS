# Сборка и unit-тесты на симуляторе. Публикация в App Store не используется.
#
# Важно:
# - Нужна общая схема: CurrencyConverter.xcodeproj/xcshareddata/xcschemes/CurrencyConverter.xcscheme
# - IPHONEOS_DEPLOYMENT_TARGET = 26 требует Xcode с iOS 26 SDK. На github.com/runner-images
#   смотри, какой Xcode на macos-15/macos-latest; при ошибке SDK понизь deployment target
#   в настройках проекта (например до 18) или используй self-hosted runner с нужным Xcode.
# - В проекте задан DEVELOPMENT_TEAM: на чужих форках CI может попросить подпись. Тогда для
#   открытого репозитория обычно убирают team из Debug или настраивают секреты (отдельная тема).

name: iOS CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project CurrencyConverter.xcodeproj

      - name: Build (iOS Simulator)
        run: |
          set -eo pipefail
          xcodebuild build \
            -project CurrencyConverter.xcodeproj \
            -scheme CurrencyConverter \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Unit tests
        run: |
          set -eo pipefail
          xcodebuild test \
            -project CurrencyConverter.xcodeproj \
            -scheme CurrencyConverter \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            -only-testing:CurrencyConverterTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
